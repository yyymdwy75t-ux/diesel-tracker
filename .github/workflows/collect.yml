name: collect-diesel-prices

on:
  schedule:
    - cron: "17 11 * * *"   # daily 11:17 UTC (about 6:17 AM Central); odd minute avoids the busy top of the hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed so the job can commit data/ back to the repo

concurrency:
  group: collect-diesel-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prices
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python collect.py

      - name: Commit data
        run: |
          git config user.name "diesel-bot"
          git config user.email "diesel-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
